# Prometheus Configuration

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'gps-inference-api'
    static_configs:
      - targets: ['api:9090']
    scrape_interval: 5s
    metrics_path: /metrics

  - job_name: 'gps-inference-worker'
    static_configs:
      - targets: ['worker:9090']
    scrape_interval: 5s
    metrics_path: /metrics
