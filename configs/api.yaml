# API Configuration

api:
  name: gps-home-office-inference
  version: 1.0.0
  description: API for Home/Office/POI inference from GPS traces
  
  # Server settings
  host: 0.0.0.0
  port: 8000
  workers: 1
  reload: false

  # CORS
  cors:
    enabled: true
    origins:
      - "*"
    methods:
      - GET
      - POST
    headers:
      - "*"

  # Rate limiting
  rate_limit:
    enabled: true
    requests_per_minute: 60
    burst: 10

  # Timeout
  timeout:
    request: 30
    keepalive: 5

# Endpoints
endpoints:
  classify: /v1/classify/{user_id}
  health: /health
  ready: /ready
  metrics: /metrics

# Request/Response
pagination:
  default_limit: 100
  max_limit: 1000

# Logging
logging:
  level: INFO
  format: json
  include_request_id: true
