openapi: 3.1.0
info:
  title: gps-home-office-inference
  description: 'API for inferring **Home / Office / POI** locations from GPS stay-points.


    - **v1** — heuristic-on-stay-points (baseline)

    - **v2** — DBSCAN cluster then heuristic (noise-robust)


    Confidence is heuristic (no supervised ground-truth available).'
  version: 0.1.0
paths:
  /health:
    get:
      tags:
      - Health
      summary: Health Check
      operationId: health_check_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /ready:
    get:
      tags:
      - Health
      summary: Readiness Check
      operationId: readiness_check_ready_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /v1/classify/{user_id}:
    post:
      tags:
      - Classification
      summary: Classify a user's locations (home/office/POI)
      operationId: classify_user_v1_classify__user_id__post
      parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: string
          title: User Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClassificationRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassificationResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /metrics:
    get:
      tags:
      - Monitoring
      summary: Prometheus Metrics
      operationId: prometheus_metrics_metrics_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
components:
  schemas:
    ClassificationRequest:
      properties:
        stay_points:
          items:
            $ref: '#/components/schemas/StayPointInput'
          type: array
          minItems: 1
          title: Stay Points
          description: The user's stay-points, e.g. rows of data/processed/staypoints/user_{id}.parquet
      type: object
      required:
      - stay_points
      title: ClassificationRequest
      description: Request schema for the classification endpoint (the user id is
        in the URL).
      example:
        stay_points:
        - altitude_m: 50.0
          arrival_time: '2008-10-23T14:30:00'
          departure_time: '2008-10-23T22:45:00'
          lat: 39.9847
          lon: 116.3184
          observed_minutes: 480.0
        - arrival_time: '2008-10-24T01:00:00'
          departure_time: '2008-10-24T10:30:00'
          lat: 40.0043
          lon: 116.3263
    ClassificationResponse:
      properties:
        user_id:
          type: string
          title: User Id
          description: User identifier
        locations:
          items:
            $ref: '#/components/schemas/LocationOutput'
          type: array
          title: Locations
          description: All detected locations
        home:
          anyOf:
          - $ref: '#/components/schemas/LocationOutput'
          - type: 'null'
          description: Inferred home location
        office:
          anyOf:
          - $ref: '#/components/schemas/LocationOutput'
          - type: 'null'
          description: Inferred office location
        home_status:
          $ref: '#/components/schemas/PlaceStatusOutput'
          description: Status and evidence of the home answer
        office_status:
          $ref: '#/components/schemas/PlaceStatusOutput'
          description: Status and evidence of the office answer
        pois:
          items:
            $ref: '#/components/schemas/LocationOutput'
          type: array
          title: Pois
          description: Points of Interest
        model_version:
          type: string
          title: Model Version
          description: Model version used
        processed_at:
          type: string
          format: date-time
          title: Processed At
          description: Processing timestamp
      type: object
      required:
      - user_id
      - locations
      - home_status
      - office_status
      - model_version
      title: ClassificationResponse
      description: Response schema for classification endpoint.
    ErrorResponse:
      properties:
        detail:
          type: string
          title: Detail
          description: Error message
        error_code:
          anyOf:
          - type: string
          - type: 'null'
          title: Error Code
          description: Error code
        timestamp:
          type: string
          format: date-time
          title: Timestamp
          description: Error timestamp
      type: object
      required:
      - detail
      title: ErrorResponse
      description: Response schema for errors.
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    HealthResponse:
      properties:
        status:
          type: string
          enum:
          - healthy
          - ready
          title: Status
          description: Health status
        version:
          type: string
          title: Version
          description: API version
        model_version:
          type: string
          title: Model Version
          description: Loaded model version
      type: object
      required:
      - status
      - version
      - model_version
      title: HealthResponse
      description: Response schema for health endpoints.
    LocationOutput:
      properties:
        lat:
          type: number
          title: Lat
          description: Latitude
        lon:
          type: number
          title: Lon
          description: Longitude
        location_type:
          type: string
          enum:
          - home
          - office
          - poi
          - unknown
          title: Location Type
          description: Type of location
        confidence:
          type: number
          maximum: 1.0
          minimum: 0.0
          title: Confidence
          description: Heuristic score [0..1] — share of the user's time spent at
            this location within the expected time-window (see LocationOutput docstring).
            Not a learned probability.
        visit_count:
          type: integer
          minimum: 1.0
          title: Visit Count
          description: Number of visits to this location
          default: 1
        duration_minutes:
          type: number
          minimum: 0.0
          title: Duration Minutes
          description: Total dwell time across all visits (minutes)
          default: 0
        altitude_m:
          anyOf:
          - type: number
          - type: 'null'
          title: Altitude M
          description: Mean altitude (metres) over the visits to this location; null
            means altitude was not provided in the input.
        first_seen:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: First Seen
          description: First visit timestamp (naive GMT)
        last_seen:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Last Seen
          description: Most recent visit timestamp (naive GMT)
        geohash:
          anyOf:
          - type: string
          - type: 'null'
          title: Geohash
          description: Geohash encoding for privacy
      type: object
      required:
      - lat
      - lon
      - location_type
      - confidence
      title: LocationOutput
      description: "Output schema for a classified location.\n\n## Confidence score\n\
        The ``confidence`` field is a **heuristic** value in [0, 1] — NOT a\nsupervised-learning\
        \ probability. It is computed as:\n\n    confidence = winner_window_minutes\
        \ / total_type_window_minutes\n\nwhere the minutes are the time stay-points\
        \ spend inside the type's daily\nwindow (local time), ``winner`` is the stay-point\
        \ with the most such\nminutes (v1 scores each stay-point on its own) and ``type``\
        \ is one of\n``\"home\" / \"office\" / \"poi\"``. POIs use plain dwell time.\
        \ The intuition: if a single location\ncaptures most of the user's time inside\
        \ the expected time-window\n(e.g. nights for home, work-hours for office)\
        \ we are confident\nthat this is *the* home/office.\n\nBecause GeoLife has\
        \ no ground-truth home/office labels, we cannot\ntrain a calibrated probability;\
        \ this is a deterministic,\nreproducible heuristic and should be treated as\
        \ a relative score\nfor ranking candidates rather than an absolute probability."
    PlaceStatusOutput:
      properties:
        status:
          type: string
          enum:
          - found
          - unknown
          title: Status
          description: 'found: the location is given; unknown: it is null'
        reason:
          anyOf:
          - type: string
            enum:
            - no_candidate
            - too_few_window_minutes
            - one_off_place
          - type: 'null'
          title: Reason
          description: 'Why the answer is unknown: no stay-point has any minute in
            the window; the best candidate has fewer than 240 minutes in the window;
            or it is a one-off (v1: no other stay-point with window minutes within
            200 m; v2: window minutes on a single day). Null when found.'
        window_minutes:
          anyOf:
          - type: number
          - type: 'null'
          title: Window Minutes
          description: Minutes of the best candidate inside the window; null without
            candidates
        support:
          anyOf:
          - type: integer
          - type: 'null'
          title: Support
          description: 'How many times the user was at the best candidate''s place
            inside the window (v1: stay-points within 200 m of it, itself included;
            v2: distinct days with window minutes at the place); null without candidates'
      type: object
      required:
      - status
      title: PlaceStatusOutput
      description: Whether home / office was answered, and the evidence behind the
        answer.
    StayPointInput:
      properties:
        lat:
          type: number
          maximum: 90.0
          minimum: -90.0
          title: Lat
          description: Latitude of the stay centroid (decimal degrees, WGS84)
        lon:
          type: number
          maximum: 180.0
          minimum: -180.0
          title: Lon
          description: Longitude of the stay centroid (decimal degrees, WGS84)
        arrival_time:
          type: string
          format: date-time
          title: Arrival Time
          description: Arrival (ISO-8601). Naive values are GMT, as in GeoLife; tz-aware
            values are converted to GMT.
        departure_time:
          type: string
          format: date-time
          title: Departure Time
          description: Departure (ISO-8601), after arrival_time. Same time convention.
        observed_minutes:
          anyOf:
          - type: number
            minimum: 0.0
          - type: 'null'
          title: Observed Minutes
          description: Minutes of the stay actually covered by GPS points (gaps >
            20 min excluded); at most departure - arrival.
        altitude_m:
          anyOf:
          - type: number
          - type: 'null'
          title: Altitude M
          description: Mean altitude in metres (optional).
      type: object
      required:
      - lat
      - lon
      - arrival_time
      - departure_time
      title: StayPointInput
      description: 'One stay-point: where the user stayed, from when to when.'
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
