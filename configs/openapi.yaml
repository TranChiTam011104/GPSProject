openapi: 3.1.0
info:
  title: gps-home-office-inference
  description: 'API for inferring **Home / Office / POI** locations from GPS stay-points.


    - **v1** — heuristic-on-stay-points (baseline)

    - **v2** — DBSCAN cluster then heuristic (noise-robust)


    Confidence is heuristic (no supervised ground-truth available).'
  version: 0.1.0
paths:
  /health:
    get:
      tags:
      - Health
      summary: Health Check
      operationId: health_check_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /ready:
    get:
      tags:
      - Health
      summary: Readiness Check
      operationId: readiness_check_ready_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /v1/classify/{user_id}:
    post:
      tags:
      - Classification
      summary: Classify a user's locations (home/office/POI)
      operationId: classify_user_v1_classify__user_id__post
      parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: string
          title: User Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClassificationRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassificationResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /metrics:
    get:
      tags:
      - Monitoring
      summary: Prometheus Metrics
      operationId: prometheus_metrics_metrics_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
components:
  schemas:
    ClassificationRequest:
      properties:
        user_id:
          anyOf:
          - type: string
          - type: 'null'
          title: User Id
          description: Optional global user_id for all stay-points in this request.
            Per-row ``user_id`` stays take precedence.
        stay_points:
          items:
            $ref: '#/components/schemas/StayPointInput'
          type: array
          minItems: 1
          title: Stay Points
          description: List of stay-points from GPS trajectory
        include_geohash:
          type: boolean
          title: Include Geohash
          description: Include geohash encoding in response
          default: true
      type: object
      required:
      - stay_points
      title: ClassificationRequest
      description: Request schema for classification endpoint.
      example:
        include_geohash: true
        stay_points:
        - altitude_m: 50.0
          arrival_time: '2008-10-23T22:30:00'
          departure_time: '2008-10-24T06:45:00'
          lat: 39.9847
          lng: 116.3184
        - altitude_m: 45.0
          arrival_time: '2008-10-24T09:00:00'
          departure_time: '2008-10-24T18:30:00'
          lat: 39.9847
          lng: 116.3185
        user_id: '010'
    ClassificationResponse:
      properties:
        user_id:
          type: string
          title: User Id
          description: User identifier
        locations:
          items:
            $ref: '#/components/schemas/LocationOutput'
          type: array
          title: Locations
          description: All detected locations
        home:
          anyOf:
          - $ref: '#/components/schemas/LocationOutput'
          - type: 'null'
          description: Inferred home location
        office:
          anyOf:
          - $ref: '#/components/schemas/LocationOutput'
          - type: 'null'
          description: Inferred office location
        pois:
          items:
            $ref: '#/components/schemas/LocationOutput'
          type: array
          title: Pois
          description: Points of Interest
        model_version:
          type: string
          title: Model Version
          description: Model version used
        processed_at:
          type: string
          format: date-time
          title: Processed At
          description: Processing timestamp
      type: object
      required:
      - user_id
      - locations
      - model_version
      title: ClassificationResponse
      description: Response schema for classification endpoint.
    ErrorResponse:
      properties:
        detail:
          type: string
          title: Detail
          description: Error message
        error_code:
          anyOf:
          - type: string
          - type: 'null'
          title: Error Code
          description: Error code
        timestamp:
          type: string
          format: date-time
          title: Timestamp
          description: Error timestamp
      type: object
      required:
      - detail
      title: ErrorResponse
      description: Response schema for errors.
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    HealthResponse:
      properties:
        status:
          type: string
          enum:
          - healthy
          - ready
          title: Status
          description: Health status
        version:
          type: string
          title: Version
          description: API version
        model_version:
          type: string
          title: Model Version
          description: Loaded model version
      type: object
      required:
      - status
      - version
      - model_version
      title: HealthResponse
      description: Response schema for health endpoints.
    LocationOutput:
      properties:
        lat:
          type: number
          title: Lat
          description: Latitude
        lng:
          type: number
          title: Lng
          description: Longitude
        location_type:
          type: string
          enum:
          - home
          - office
          - poi
          - unknown
          title: Location Type
          description: Type of location
        confidence:
          type: number
          maximum: 1.0
          minimum: 0.0
          title: Confidence
          description: Heuristic score [0..1] — share of the user's time spent at
            this location within the expected time-window (see LocationOutput docstring).
            Not a learned probability.
        visit_count:
          type: integer
          minimum: 1.0
          title: Visit Count
          description: Number of visits to this location
          default: 1
        duration_minutes:
          type: number
          minimum: 0.0
          title: Duration Minutes
          description: Total dwell time across all visits (minutes)
          default: 0
        altitude_m:
          anyOf:
          - type: number
          - type: 'null'
          title: Altitude M
          description: Mean altitude (metres) over the visits to this location; null
            means altitude was not provided in the input.
        first_seen:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: First Seen
          description: First visit timestamp (naive GMT)
        last_seen:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Last Seen
          description: Most recent visit timestamp (naive GMT)
        geohash:
          anyOf:
          - type: string
          - type: 'null'
          title: Geohash
          description: Geohash encoding for privacy
      type: object
      required:
      - lat
      - lng
      - location_type
      - confidence
      title: LocationOutput
      description: "Output schema for a classified location.\n\n## Confidence score\n\
        The ``confidence`` field is a **heuristic** value in [0, 1] — NOT a\nsupervised-learning\
        \ probability. It is computed as:\n\n    confidence = winner_dwell_time /\
        \ total_type_dwell_time\n\nwhere ``winner`` is the most-visited (or longest-dwell)\
        \ stay-point\ncluster for that location type and ``type`` is one of\n``\"\
        home\" / \"office\" / \"poi\"``. The intuition: if a single location\ncaptures\
        \ most of the user's time inside the expected time-window\n(e.g. nights for\
        \ home, work-hours for office) we are confident\nthat this is *the* home/office.\n\
        \nBecause GeoLife has no ground-truth home/office labels, we cannot\ntrain\
        \ a calibrated probability; this is a deterministic,\nreproducible heuristic\
        \ and should be treated as a relative score\nfor ranking candidates rather\
        \ than an absolute probability."
    StayPointInput:
      properties:
        lat:
          type: number
          maximum: 90.0
          minimum: -90.0
          title: Lat
          description: Latitude (decimal degrees, WGS84)
        lng:
          type: number
          maximum: 180.0
          minimum: -180.0
          title: Lng
          description: Longitude (decimal degrees, WGS84)
        arrival_time:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Arrival Time
          description: When the user arrived at this location (ISO-8601, naive or
            tz-aware). GeoLife timestamps are naive GMT; cloud devices (OwnTracks,
            Google Takeout) post tz-aware. Required when posting an aggregated stay-point.
        departure_time:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Departure Time
          description: When the user left (ISO-8601, naive or tz-aware). Must be >
            arrival_time.
        duration_minutes:
          anyOf:
          - type: number
            minimum: 0.0
          - type: 'null'
          title: Duration Minutes
          description: Pre-computed dwell time in minutes (auto-calculated when arrival+departure
            set)
        timestamp:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Timestamp
          description: Raw timestamp (naive GMT) — only used when posting a single
            GPS observation. Equivalent to arrival_time when both are absent.
        altitude_m:
          anyOf:
          - type: number
          - type: 'null'
          title: Altitude M
          description: 'Altitude in metres (GeoLife raw is in feet: × 0.3048 upstream).'
        accuracy:
          anyOf:
          - type: number
            minimum: 0.0
          - type: 'null'
          title: Accuracy
          description: Horizontal GPS accuracy in metres (optional).
        user_id:
          anyOf:
          - type: string
          - type: 'null'
          title: User Id
          description: Per-row override of the user_id from the URL path (optional).
      type: object
      required:
      - lat
      - lng
      title: StayPointInput
      description: 'Input schema for a single stay-point (pre-aggregated) **or** a
        single

        raw GPS observation.


        Required for *stay-points*:


        - ``arrival_time``  — when the user arrived at this location

        - ``departure_time`` — when they left (``arrival_time < departure_time``)


        Required for *raw GPS observations* (alternative use):


        - ``timestamp`` — naive GMT, parsed from GeoLife ``.plt`` date_str+time_str


        Either ``arrival_time`` **or** ``timestamp`` must be supplied; if both are

        present, ``timestamp`` is ignored by the classifier (the stay-point

        variant wins).'
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
