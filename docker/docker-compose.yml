version: '3.8'

services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - GPS_ENV=dev
      - GPS_MODEL_VERSION=v1
      - GPS_LOG_LEVEL=INFO
    volumes:
      - ../src:/app/src
      - ../data:/app/data
      - ../models:/app/models
    networks:
      - gps-network

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ../configs/prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - gps-network

networks:
  gps-network:
    driver: bridge

