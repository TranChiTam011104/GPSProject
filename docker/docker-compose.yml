version: '3.8'

services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=development
      - LOG_LEVEL=INFO
      - MLFLOW_TRACKING_URI=http://mlflow:5000
    volumes:
      - ../src:/app/src
      - ../data:/app/data
      - ../models:/app/models
    depends_on:
      - mlflow
    networks:
      - gps-network

  mlflow:
    image: ghcr.io/mlflow/mlflow:latest
    ports:
      - "5000:5000"
    command: mlflow ui --backend-store-uri sqlite:///mlflow.db
    volumes:
      - mlflow-data:/mlflow
    networks:
      - gps-network

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ../configs/prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - gps-network

networks:
  gps-network:
    driver: bridge

volumes:
  mlflow-data:
